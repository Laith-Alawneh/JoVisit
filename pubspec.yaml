name: jordan_tourism_app
description: BTEC Level 3 Unit 7 - Jordan Tourism Mobile App built with Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  flutter_rating_bar: ^4.0.1
  
  # Video Player
  video_player: ^2.8.2
  chewie: ^1.7.4
  youtube_player_flutter: ^9.0.0
  
  # Audio Player
  audioplayers: ^5.2.1
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & Images
  http: ^1.1.2
  cached_network_image: ^3.3.1
  
  # Animations
  animations: ^2.0.11
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Fonts
  google_fonts: ^6.1.0
  
  # SVG & Maps
  flutter_svg: ^2.0.0+1
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/audio/clapping.mp3
    - assets/audio/success_chime.mp3
    - assets/audio/wrong-buzzer.mp3
    - pics/
  
  shaders:
    - assets/shaders/frosted_glass.frag